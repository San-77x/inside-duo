<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#5b48d8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e4f5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>

  <!-- Two panels with a gap: the fold reads even at 16px, where a hinge line would vanish. -->
  <rect x="146" y="132" width="102" height="248" rx="17" fill="url(#panel)"/>
  <rect x="264" y="132" width="102" height="248" rx="17" fill="url(#panel)"/>

  <!-- Hinge shadow, purely for larger sizes. -->
  <rect x="248" y="140" width="16" height="232" fill="#000" opacity="0.16"/>
</svg>
